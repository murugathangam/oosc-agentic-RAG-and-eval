<svg width="880" height="720" viewBox="0 0 880 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f24"/>
      <stop offset="1" stop-color="#131619"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57c9a6"/>
      <stop offset="1" stop-color="#3fa588"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a996f0"/>
      <stop offset="1" stop-color="#8a76e0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7f8b93"/>
    </marker>
    <marker id="arrowAcc" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57c9a6"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="880" height="720" rx="18" fill="url(#bg)"/>

  <text x="440" y="46" text-anchor="middle" fill="#e8ecef" font-size="22" font-weight="700">Study Copilot — System Architecture</text>
  <text x="440" y="70" text-anchor="middle" fill="#a3adb5" font-size="13">Ingestion · Agentic retrieval · Evaluation</text>

  <!-- ============ INGESTION (top row) ============ -->
  <text x="60" y="112" fill="#57c9a6" font-size="12" font-weight="700" letter-spacing="1">INGESTION  (once per document)</text>

  <!-- box: upload -->
  <g filter="url(#soft)">
    <rect x="40" y="126" width="170" height="70" rx="12" fill="#242b32" stroke="#333d46"/>
  </g>
  <text x="125" y="156" text-anchor="middle" fill="#e8ecef" font-size="14" font-weight="600">PDF / Word / Text</text>
  <text x="125" y="176" text-anchor="middle" fill="#a3adb5" font-size="11">extracted in-browser</text>

  <!-- box: chunk -->
  <g filter="url(#soft)">
    <rect x="250" y="126" width="150" height="70" rx="12" fill="#242b32" stroke="#333d46"/>
  </g>
  <text x="325" y="158" text-anchor="middle" fill="#e8ecef" font-size="14" font-weight="600">Chunking</text>
  <text x="325" y="176" text-anchor="middle" fill="#a3adb5" font-size="11">overlapping pieces</text>

  <!-- box: embed -->
  <g filter="url(#soft)">
    <rect x="440" y="126" width="170" height="70" rx="12" fill="#242b32" stroke="#333d46"/>
  </g>
  <text x="525" y="156" text-anchor="middle" fill="#e8ecef" font-size="14" font-weight="600">Embeddings</text>
  <text x="525" y="176" text-anchor="middle" fill="#a3adb5" font-size="11">all-MiniLM-L6-v2</text>

  <!-- box: chroma -->
  <g filter="url(#soft)">
    <rect x="650" y="126" width="180" height="70" rx="12" fill="#1f3a33" stroke="#57c9a6" stroke-width="1.5"/>
  </g>
  <text x="740" y="156" text-anchor="middle" fill="#57c9a6" font-size="14" font-weight="700">ChromaDB</text>
  <text x="740" y="176" text-anchor="middle" fill="#8fd8c0" font-size="11">local vector store</text>

  <!-- ingestion arrows -->
  <line x1="210" y1="161" x2="248" y2="161" stroke="#7f8b93" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="161" x2="438" y2="161" stroke="#7f8b93" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="161" x2="648" y2="161" stroke="#7f8b93" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- divider -->
  <line x1="40" y1="228" x2="840" y2="228" stroke="#2b333b" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ============ QUERY / AGENTIC (middle) ============ -->
  <text x="60" y="258" fill="#a996f0" font-size="12" font-weight="700" letter-spacing="1">QUERY  (per question — agentic loop)</text>

  <!-- question box -->
  <g filter="url(#soft)">
    <rect x="40" y="274" width="170" height="64" rx="12" fill="#242b32" stroke="#333d46"/>
  </g>
  <text x="125" y="311" text-anchor="middle" fill="#e8ecef" font-size="14" font-weight="600">Student question</text>

  <!-- LLM box -->
  <g filter="url(#soft)">
    <rect x="300" y="264" width="220" height="84" rx="14" fill="#2d2a45" stroke="#a996f0" stroke-width="1.5"/>
  </g>
  <text x="410" y="296" text-anchor="middle" fill="#c9bdf7" font-size="15" font-weight="700">gpt-oss-120b</text>
  <text x="410" y="316" text-anchor="middle" fill="#a996f0" font-size="11">tool-calling agent</text>
  <text x="410" y="333" text-anchor="middle" fill="#8a86a8" font-size="10.5">decides when &amp; what to search</text>

  <!-- retrieve tool -->
  <g filter="url(#soft)">
    <rect x="610" y="274" width="220" height="64" rx="12" fill="#242b32" stroke="#57c9a6" stroke-width="1.3"/>
  </g>
  <text x="720" y="303" text-anchor="middle" fill="#57c9a6" font-size="14" font-weight="700">retrieve(query)</text>
  <text x="720" y="322" text-anchor="middle" fill="#a3adb5" font-size="11">searches ChromaDB</text>

  <!-- question -> llm -->
  <line x1="210" y1="306" x2="298" y2="306" stroke="#7f8b93" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- llm <-> retrieve loop -->
  <line x1="520" y1="298" x2="608" y2="298" stroke="#57c9a6" stroke-width="2" marker-end="url(#arrowAcc)"/>
  <text x="564" y="291" text-anchor="middle" fill="#57c9a6" font-size="10">calls</text>
  <path d="M608,318 C560,340 470,340 522,320" fill="none" stroke="#57c9a6" stroke-width="2" marker-end="url(#arrowAcc)"/>
  <text x="565" y="352" text-anchor="middle" fill="#8fd8c0" font-size="10">results back — loops until it has enough</text>

  <!-- retrieve -> chroma (up) -->
  <path d="M760,274 C775,240 775,215 760,198" fill="none" stroke="#4a5560" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- divider -->
  <line x1="40" y1="384" x2="840" y2="384" stroke="#2b333b" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ============ EVALUATION (bottom) ============ -->
  <text x="60" y="414" fill="#e0b25a" font-size="12" font-weight="700" letter-spacing="1">EVALUATION &amp; RESPONSE</text>

  <!-- trajectory metrics -->
  <g filter="url(#soft)">
    <rect x="40" y="430" width="230" height="78" rx="12" fill="#242b32" stroke="#333d46"/>
  </g>
  <text x="155" y="461" text-anchor="middle" fill="#e8ecef" font-size="14" font-weight="600">Trajectory metrics</text>
  <text x="155" y="480" text-anchor="middle" fill="#a3adb5" font-size="11">steps · loops · drift ·</text>
  <text x="155" y="495" text-anchor="middle" fill="#a3adb5" font-size="11">efficiency (pure Python)</text>

  <!-- web fallback -->
  <g filter="url(#soft)">
    <rect x="310" y="430" width="230" height="78" rx="12" fill="#3a3120" stroke="#e0b25a" stroke-width="1.3"/>
  </g>
  <text x="425" y="461" text-anchor="middle" fill="#e0b25a" font-size="14" font-weight="700">Web fallback</text>
  <text x="425" y="480" text-anchor="middle" fill="#d8c295" font-size="11">compound-mini — only if</text>
  <text x="425" y="495" text-anchor="middle" fill="#d8c295" font-size="11">local match is weak</text>

  <!-- faithfulness -->
  <g filter="url(#soft)">
    <rect x="580" y="430" width="250" height="78" rx="12" fill="#242b32" stroke="#333d46"/>
  </g>
  <text x="705" y="461" text-anchor="middle" fill="#e8ecef" font-size="14" font-weight="600">Faithfulness judge</text>
  <text x="705" y="480" text-anchor="middle" fill="#a3adb5" font-size="11">separate model call —</text>
  <text x="705" y="495" text-anchor="middle" fill="#a3adb5" font-size="11">answer vs. retrieved text</text>

  <!-- arrows from loop down into eval -->
  <path d="M360,348 C300,395 155,400 155,428" fill="none" stroke="#7f8b93" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="270" y1="469" x2="308" y2="469" stroke="#7f8b93" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="540" y1="469" x2="578" y2="469" stroke="#7f8b93" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- final response box -->
  <g filter="url(#soft)">
    <rect x="180" y="560" width="520" height="86" rx="16" fill="url(#accent)"/>
  </g>
  <text x="440" y="596" text-anchor="middle" fill="#0f2019" font-size="16" font-weight="700">Response to student</text>
  <text x="440" y="620" text-anchor="middle" fill="#123328" font-size="12.5">answer · citations · trajectory · metrics · faithfulness · trust label</text>

  <!-- eval -> response -->
  <path d="M155,508 C155,545 360,545 380,558" fill="none" stroke="#7f8b93" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M705,508 C705,545 500,545 500,558" fill="none" stroke="#7f8b93" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="440" y="690" text-anchor="middle" fill="#6b757d" font-size="11">Local-first: notes are searched before any web call · every answer is scored before it reaches the student</text>
</svg>
